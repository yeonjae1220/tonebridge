name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tonebridge-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/tonebridge-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Flutter Web
        working-directory: ./mobile
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter test
          flutter build web --release \
            --dart-define=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --dart-define=API_BASE_URL=https://tonebridge.mungji.com
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build & push frontend (Next.js)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://tonebridge.mungji.com
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    # self-hosted runner on lenovo — 내부망 직접 실행, SSH/포트포워딩 불필요
    runs-on: [self-hosted, homelab]

    steps:
      - uses: actions/checkout@v4

      - name: Prepare deploy directory
        run: sudo mkdir -p /opt/tonebridge && sudo chown $USER:$USER /opt/tonebridge

      - name: Copy k8s manifests
        run: cp -r k8s/ /opt/tonebridge/

      - name: Apply k8s manifests & roll out
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD_BCRYPT: ${{ secrets.ADMIN_PASSWORD_BCRYPT }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e

          # 네임스페이스 먼저 생성 (Secret 적용 전 필수)
          sudo kubectl apply -f /opt/tonebridge/k8s/namespace.yaml

          # k8s Secret 동적 생성/업데이트 (민감 값은 GitHub Actions Secrets에서 주입)
          sudo kubectl create secret generic tonebridge-secret \
            --from-literal=POSTGRES_PASSWORD="${POSTGRES_PASSWORD}" \
            --from-literal=REDIS_PASSWORD="${REDIS_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID}" \
            --from-literal=GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET}" \
            --from-literal=CLAUDE_API_KEY="${CLAUDE_API_KEY}" \
            --from-literal=OPENAI_API_KEY="" \
            --from-literal=MINIO_ROOT_USER="minio-tonebridge" \
            --from-literal=MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            --from-literal=CORS_ALLOWED_ORIGINS="https://tonebridge.mungji.com" \
            --from-literal=ADMIN_EMAIL="${ADMIN_EMAIL}" \
            --from-literal=ADMIN_PASSWORD_BCRYPT="${ADMIN_PASSWORD_BCRYPT}" \
            -n tonebridge \
            --dry-run=client -o yaml | sudo kubectl apply -f -

          # 나머지 인프라 적용
          sudo kubectl apply -f /opt/tonebridge/k8s/network-policy.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/postgres.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/redis.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/minio.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/minio-init.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/backend.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/frontend.yaml
          sudo kubectl apply -f /opt/tonebridge/k8s/ingress.yaml

          # 이미지 최신화 및 롤아웃 (SHA 태그로 변경을 강제하여 :latest 동일 시 롤아웃 누락 방지)
          sudo kubectl set image deployment/backend \
            backend="${BACKEND_IMAGE}:${GIT_SHA}" \
            -n tonebridge
          sudo kubectl set image deployment/frontend \
            frontend="${FRONTEND_IMAGE}:${GIT_SHA}" \
            -n tonebridge

          if ! sudo kubectl rollout status deployment/backend -n tonebridge --timeout=300s; then
            echo "=== Backend pod status ==="
            sudo kubectl get pods -n tonebridge -l app=backend -o wide
            NEW_POD=$(sudo kubectl get pods -n tonebridge -l app=backend \
              --sort-by=.metadata.creationTimestamp -o jsonpath='{.items[-1].metadata.name}')
            sudo kubectl logs "$NEW_POD" -n tonebridge --tail=50 2>/dev/null || true
            sudo kubectl describe pod "$NEW_POD" -n tonebridge | tail -30
            exit 1
          fi

          if ! sudo kubectl rollout status deployment/frontend -n tonebridge --timeout=120s; then
            echo "=== Frontend pod status ==="
            sudo kubectl get pods -n tonebridge -l app=frontend -o wide
            exit 1
          fi

      - name: Purge Cloudflare cache for Next.js entry-point pages
        # Cloudflare Tunnel routes all traffic through CF edge. Purge HTML routes
        # on every deploy so CF fetches fresh SSR/standalone responses.
        # Requires CF_ZONE_ID and CF_API_TOKEN repository secrets. Skips gracefully if absent.
        continue-on-error: true
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "${CF_ZONE_ID}" ] || [ -z "${CF_API_TOKEN}" ]; then
            echo "CF_ZONE_ID or CF_API_TOKEN not set — skipping Cloudflare cache purge"
            exit 0
          fi
          BASE="https://tonebridge.mungji.com"
          RESULT=$(curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"files\":[\"${BASE}/\",\"${BASE}/feed\",\"${BASE}/request\",\"${BASE}/study\",\"${BASE}/friends\",\"${BASE}/profile\",\"${BASE}/profile/wallet\",\"${BASE}/profile/settings\",\"${BASE}/profile/language-edit\",\"${BASE}/wallet\",\"${BASE}/login\",\"${BASE}/onboarding\",\"${BASE}/admin\",\"${BASE}/admin/users\"]}")
          echo "CF purge response: ${RESULT}"
          echo "${RESULT}" | python3 -c "import sys,json; r=json.load(sys.stdin); print('CF purge: OK' if r.get('success') else 'FAILED: '+str(r.get('errors','')))"
