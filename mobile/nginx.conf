server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow microphone only from same origin (required for PWA recording)
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # SPA routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Flutter entry-point files — never cache with immutable because the filename
    # never changes across builds.  The Flutter service worker manages caching;
    # the HTTP layer must always revalidate so browsers pick up new bundles.
    #
    # s-maxage=0            — tells any CDN/proxy (Cloudflare, Nginx caches) max-age=0
    # Cloudflare-CDN-Cache-Control — overrides Cache-Control specifically for Cloudflare edge
    # CDN-Cache-Control     — generic shared-cache override header (Fastly, CloudFront, etc.)
    # Pragma: no-cache      — HTTP/1.0 backward compat
    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    location = /flutter.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Cache immutable assets aggressively (fingerprinted by content hash)
    location ~* \.(js|wasm|css|png|jpg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry point
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Flutter service worker — no cache so updates propagate immediately
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    # Stub service worker (formerly Firebase Messaging) — no-cache so browsers
    # pick up the empty replacement immediately and stop loading Firebase CDN scripts.
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, s-maxage=0" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }
}
