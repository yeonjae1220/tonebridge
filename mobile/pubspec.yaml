name: tonebridge
description: ToneBridge - Language correction community app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2-dev.2
  riverpod_annotation: ^4.0.3-dev.2

  # Navigation
  go_router: ^17.2.3

  # Networking
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Audio — record supports Android/iOS/Web via MediaRecorder
  record: ^5.2.0
  just_audio: ^0.10.5
  path_provider: ^2.1.5

  # Firebase / Push notifications
  firebase_core: ^4.9.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^16.2.2

  # Secure storage (JWT, refresh token)
  flutter_secure_storage: ^10.2.0

  # Google Sign-In SDK (replaces browser-based OAuth flow)
  google_sign_in: ^7.2.0

  # HTTP client for SSE (explicit — not transitive dependency)
  http: ^1.2.0

  # Data models
  freezed_annotation: ^3.1.0

  # UI utilities
  cached_network_image: ^3.4.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.4-dev.3
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.8.0

  # Linting
  flutter_lints: ^6.0.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
