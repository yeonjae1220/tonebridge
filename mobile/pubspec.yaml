name: tonebridge
description: ToneBridge - Language correction community app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # Audio
  flutter_sound: ^9.16.3
  just_audio: ^0.9.43

  # Firebase / Push notifications
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

  # Secure storage (JWT, refresh token)
  flutter_secure_storage: ^9.2.2

  # Google Sign-In SDK (replaces browser-based OAuth flow)
  google_sign_in: ^6.2.1

  # HTTP client for SSE (explicit — not transitive dependency)
  http: ^1.2.0

  # Data models
  freezed_annotation: ^2.4.4

  # UI utilities
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.6

  # Linting
  flutter_lints: ^4.0.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
