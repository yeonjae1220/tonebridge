# App icons are generated from assets/brand — replace the PNGs there and run `make icons`.
# app_icon.png is provisional (bridge + sound bars on the theme purple #6750A4).
flutter_launcher_icons:
  image_path: "assets/brand/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true # App Store rejects icons with transparency
  min_sdk_android: 24
  adaptive_icon_background: "#6750A4"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/brand/app_icon_foreground.png" # Android 13 themed icons
  web:
    generate: false
  macos:
    generate: false
