apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tonebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # node user in node:alpine
        fsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/yeonjae1220/tonebridge-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_URL
              value: "https://tonebridge.mungji.com"
            - name: BACKEND_INTERNAL_URL
              value: "http://backend.tonebridge.svc.cluster.local:8080"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tonebridge
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
