apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tonebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101  # nginx default user
        fsGroup: 101
      containers:
        - name: frontend
          image: ghcr.io/yeonjae1220/tonebridge-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tonebridge
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 80
