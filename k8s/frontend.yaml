apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tonebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000  # node user in node:alpine
        fsGroup: 1000
      containers:
        - name: frontend
          image: ghcr.io/yeonjae1220/tonebridge-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: API_URL
              value: "https://tonebridge.mungji.com"
            - name: BACKEND_INTERNAL_URL
              value: "http://backend.tonebridge.svc.cluster.local:8080"
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          # readiness 도 liveness 와 같은 /health/live 다 — /health/ready(백엔드까지 확인)가 아니다.
          # /health/ready 는 백엔드 /actuator/health/readiness 를 부르고 그 그룹이 readinessState·db·redis
          # 라서, 여기에 걸면 DB·Redis 순단 하나가 약 15초(5s × 3) 뒤 frontend 까지 서비스에서 빼 버린다.
          # 레플리카가 1개라 로그인 화면까지 사이트 전체가 503 이 된다.
          # 백엔드 연결 상태는 라우팅이 아니라 모니터링이 /health/ready 로 볼 일이다.
          readinessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tonebridge
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 3000
