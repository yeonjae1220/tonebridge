# ⚠️ 이 파일에 민감한 값을 직접 작성하지 마세요.
# 실제 Secret은 GitHub Actions 배포 워크플로우에서 kubectl로 동적 생성됩니다.
# 로컬 개발: docker-compose.yml 의 .env 파일 사용
#
# 아래는 로컬 kubectl 수동 적용 시 참고용 명령어입니다:
#
# kubectl create secret generic tonebridge-secret \
#   --from-literal=POSTGRES_PASSWORD="<값>" \
#   --from-literal=REDIS_PASSWORD="<값>" \
#   --from-literal=JWT_SECRET="<값>" \
#   --from-literal=GOOGLE_CLIENT_ID="<값>" \
#   --from-literal=GOOGLE_CLIENT_SECRET="<값>" \
#   --from-literal=CLAUDE_API_KEY="<값>" \
#   --from-literal=OPENAI_API_KEY="" \
#   --from-literal=MINIO_ROOT_USER="minio-tonebridge" \
#   --from-literal=MINIO_ROOT_PASSWORD="<값>" \
#   --from-literal=CORS_ALLOWED_ORIGINS="https://tonebridge.mungji.com" \
#   -n tonebridge --dry-run=client -o yaml | kubectl apply -f -
