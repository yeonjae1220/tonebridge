apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: tonebridge
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-03T17-07-56Z
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /root/.mc &&
              printf '{"version":"10","aliases":{"local":{"url":"http://minio:9000","accessKey":"%s","secretKey":"%s","api":"s3v4","path":"auto"}}}\n' "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" > /root/.mc/config.json &&
              until mc ls local/ > /dev/null 2>&1; do
                echo "waiting for minio..."; sleep 5
              done &&
              mc mb --ignore-existing local/tonebridge-audio &&
              mc anonymous set none local/tonebridge-audio &&
              echo "MinIO bucket ready"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_PASSWORD
