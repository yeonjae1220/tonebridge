apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: tonebridge
  annotations:
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-03T17-07-56Z
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
              mc mb --ignore-existing local/tonebridge-audio &&
              mc anonymous set none local/tonebridge-audio &&
              mc cors set --json '[{"AllowedOrigins":["https://tonebridge.mungji.com"],"AllowedMethods":["PUT","GET"],"AllowedHeaders":["Content-Type","Content-Length"],"ExposeHeaders":["ETag"]}]' local/tonebridge-audio &&
              echo "MinIO bucket ready (private, CORS configured)"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_PASSWORD
