apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tonebridge-ingress
  namespace: tonebridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tonebridge.mungji.com
      secretName: tonebridge-tls
  rules:
    - host: tonebridge.mungji.com
      http:
        paths:
          # CRITICAL-2: /actuator 전체 제거 → /actuator/health 만 Exact 허용
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
