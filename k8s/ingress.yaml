apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tonebridge-ingress
  namespace: tonebridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "110m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - tonebridge.mungji.com
      secretName: tonebridge-tls
  rules:
    - host: tonebridge.mungji.com
      http:
        paths:
          # CRITICAL-2: /actuator 전체 제거 → /actuator/health 만 Exact 허용
          - path: /actuator/health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Admin SSR 콘솔 (Thymeleaf). /admin/** 은 백엔드 adminFilterChain(formLogin)이 담당.
          # 누락 시 catch-all /가 frontend로 보내 404가 난다 (GLOBAL-PIT-038).
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # MinIO object storage — presigned URLs are scoped to this path so
          # browsers can upload/download audio without crossing origins.
          - path: /tonebridge-audio
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
