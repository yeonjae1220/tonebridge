apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tonebridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/yeonjae1220/tonebridge-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/tonebridge
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER
              value: org.postgresql.Driver
            - name: JPA_DIALECT
              value: org.hibernate.dialect.PostgreSQLDialect
            - name: FLYWAY_ENABLED
              value: "true"
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: CLAUDE_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: OPENAI_API_KEY
            - name: STORAGE_ENDPOINT
              value: http://minio:9000
            - name: STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_USER
            - name: STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: MINIO_ROOT_PASSWORD
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: tonebridge-secret
                  key: CORS_ALLOWED_ORIGINS
            - name: FRONTEND_URL
              value: https://tonebridge.mungji.com
            - name: GOOGLE_REDIRECT_URI
              value: https://tonebridge.mungji.com/api/auth/google/callback
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tonebridge
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
