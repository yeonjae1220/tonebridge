<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::body}, '유저 관리', 'users')}"
      lang="ko">
<body>

<div style="display:flex; align-items:baseline; gap:10px; margin-bottom:20px;">
  <h1 class="page-title" style="margin:0;">유저 관리</h1>
  <span class="text-muted" th:text="'(' + ${totalElements} + '명)'"></span>
</div>

<div class="card">
  <table>
    <thead>
      <tr>
        <th>이메일</th>
        <th>닉네임</th>
        <th>모국어</th>
        <th>크레딧</th>
        <th>평판</th>
        <th>역할</th>
        <th>가입일</th>
        <th>크레딧 조정</th>
      </tr>
    </thead>
    <tbody>
      <tr th:if="${users.empty}">
        <td colspan="8" style="text-align:center; padding:32px; color:var(--muted);">유저가 없습니다.</td>
      </tr>
      <tr th:each="u : ${users}">
        <td class="text-muted" th:text="${u.email()}"></td>
        <td style="font-weight:500;" th:text="${u.username()}"></td>
        <td class="text-muted" th:text="${u.nativeLanguage() ?: '-'}"></td>
        <td style="font-weight:600;" th:text="${u.credits()}"></td>
        <td class="text-muted" th:text="${#numbers.formatDecimal(u.reputationScore(), 1, 2)}"></td>
        <td>
          <span th:class="${u.isAdmin()} ? 'badge badge-admin' : 'badge badge-user'"
                th:text="${u.isAdmin()} ? 'ADMIN' : 'USER'"></span>
        </td>
        <td class="text-muted"
            th:text="${u.createdAt() != null} ? ${#temporals.format(u.createdAt(), 'yyyy-MM-dd')} : '-'"></td>
        <td>
          <form class="inline-form"
                th:action="@{/admin/users/{id}/credits(id=${u.id()})}" method="post"
                style="display:flex; gap:6px; align-items:center;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input class="input-sm" type="number" name="delta"
                   placeholder="±크레딧" min="-10000" max="10000" required/>
            <button type="submit" class="btn btn-primary">적용</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" th:if="${totalPages > 1}">
    <a th:href="@{/admin/users(page=${currentPage - 1}, size=${pageSize})}"
       th:class="${currentPage == 0} ? 'page-link disabled' : 'page-link'">‹</a>
    <th:block th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
      <a th:href="@{/admin/users(page=${i}, size=${pageSize})}"
         th:class="${i == currentPage} ? 'page-link active' : 'page-link'"
         th:text="${i + 1}"></a>
    </th:block>
    <a th:href="@{/admin/users(page=${currentPage + 1}, size=${pageSize})}"
       th:class="${currentPage == totalPages - 1} ? 'page-link disabled' : 'page-link'">›</a>
  </div>
</div>

</body>
</html>
