<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content, pageTitle, activePage)"
      lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${pageTitle} + ' — ToneBridge Admin'">ToneBridge Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e1a; --surface: #111827; --surface2: #1f2937;
      --border: #1f2937; --text: #f1f5f9; --muted: #64748b;
      --accent: #3b82f6; --accent-h: #60a5fa;
      --danger: #ef4444; --success: #22c55e; --warning: #f59e0b;
      --sidebar-w: 220px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; font-size: 14px; }
    .sidebar { width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; }
    .sidebar-brand { padding: 22px 18px 16px; border-bottom: 1px solid var(--border); }
    .brand-logo { font-size: 17px; font-weight: 700; color: var(--accent); }
    .brand-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .sidebar-nav { flex: 1; padding: 10px 0; }
    .sidebar-nav a { display: flex; align-items: center; gap: 10px; padding: 9px 18px; color: var(--muted); text-decoration: none; font-size: 13px; transition: all .15s; }
    .sidebar-nav a:hover { color: var(--text); background: var(--surface2); }
    .sidebar-nav a.active { color: var(--accent); background: rgba(59,130,246,.08); border-left: 2px solid var(--accent); }
    .sidebar-footer { padding: 14px 18px; border-top: 1px solid var(--border); }
    .sidebar-footer form button { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 8px; padding: 0; font-family: inherit; transition: color .15s; }
    .sidebar-footer form button:hover { color: var(--danger); }
    .main { margin-left: var(--sidebar-w); flex: 1; display: flex; flex-direction: column; }
    .topbar { padding: 20px 28px 16px; border-bottom: 1px solid var(--border); }
    .page-title { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    .content { padding: 24px 28px 48px; }
    .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; font-size: 13px; border: 1px solid; }
    .flash-success { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); color: var(--success); }
    .flash-error   { background: rgba(239,68,68,.1);  border-color: rgba(239,68,68,.3);  color: var(--danger); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px 22px; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
    .stat-value { font-size: 26px; font-weight: 700; color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); background: var(--surface2); }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.02); }
    .btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: none; transition: all .15s; font-family: inherit; }
    .btn:hover { color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: var(--accent-h); }
    .btn-danger { background: transparent; color: var(--danger); border-color: rgba(239,68,68,.3); }
    .btn-danger:hover { background: rgba(239,68,68,.1); }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 500; }
    .badge-admin { background: rgba(59,130,246,.15); color: var(--accent); }
    .badge-user  { background: rgba(100,116,139,.15); color: var(--muted); }
    .inline-form { display: inline; }
    .input-sm { padding: 4px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 12px; width: 70px; outline: none; }
    .pagination { display: flex; align-items: center; gap: 5px; padding: 14px 16px; justify-content: center; }
    .page-link { padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); color: var(--muted); text-decoration: none; font-size: 12px; transition: all .15s; }
    .page-link:hover { border-color: var(--accent); color: var(--accent); }
    .page-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .page-link.disabled { pointer-events: none; opacity: .3; }
    .text-muted { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">ToneBridge</div>
    <div class="brand-sub">Admin Console</div>
  </div>
  <nav class="sidebar-nav">
    <a th:href="@{/admin/dashboard}" th:class="${activePage == 'dashboard'} ? 'active' : ''">▤ 대시보드</a>
    <a th:href="@{/admin/users}"     th:class="${activePage == 'users'}     ? 'active' : ''">◎ 유저 관리</a>
  </nav>
  <div class="sidebar-footer">
    <form th:action="@{/admin/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button type="submit"><span>⏻</span> 로그아웃</button>
    </form>
  </div>
</aside>
<div class="main">
  <div class="topbar">
    <h1 class="page-title" th:text="${pageTitle}">대시보드</h1>
  </div>
  <div class="content">
    <div th:if="${successMessage}" class="flash flash-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}"   class="flash flash-error"   th:text="${errorMessage}"></div>
    <th:block th:replace="${content}"/>
  </div>
</div>
</body>
</html>
