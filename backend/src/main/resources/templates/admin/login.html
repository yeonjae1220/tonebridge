<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — ToneBridge</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0a0e1a; --surface: #111827; --border: #1f2937; --text: #f1f5f9; --muted: #64748b; --accent: #3b82f6; --accent-h: #60a5fa; --danger: #ef4444; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { width: 100%; max-width: 360px; padding: 0 16px; }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-name { font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
    .brand-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
    .card-title { font-size: 15px; font-weight: 600; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
    .form-control { width: 100%; padding: 9px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 13px; outline: none; transition: border-color .15s; }
    .form-control:focus { border-color: var(--accent); }
    .btn-submit { width: 100%; padding: 10px; margin-top: 6px; background: var(--accent); color: #fff; border: none; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-submit:hover { background: var(--accent-h); }
    .msg { padding: 9px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; border: 1px solid; }
    .msg-error  { background: rgba(239,68,68,.1);  border-color: rgba(239,68,68,.3);  color: var(--danger); }
    .msg-logout { background: rgba(59,130,246,.08); border-color: rgba(59,130,246,.2); color: var(--accent); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-name">ToneBridge</div>
    <div class="brand-sub">Admin Console</div>
  </div>
  <div class="card">
    <h2 class="card-title">로그인</h2>
    <div th:if="${param.error}"  class="msg msg-error">이메일 또는 비밀번호가 올바르지 않습니다.</div>
    <div th:if="${param.logout}" class="msg msg-logout">로그아웃되었습니다.</div>
    <form th:action="@{/admin/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <div class="form-group">
        <label class="form-label" for="username">이메일</label>
        <input class="form-control" type="email" id="username" name="username" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">비밀번호</label>
        <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button class="btn-submit" type="submit">로그인</button>
    </form>
  </div>
</div>
</body>
</html>
