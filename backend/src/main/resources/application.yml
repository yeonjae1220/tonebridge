spring:
  application:
    name: ToneBridge

  # 로컬 개발 기본 프로파일. 운영은 k8s 가 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다(env > yaml).
  profiles:
    active: local

  threads:
    virtual:
      enabled: true

  # datasource / jpa.ddl-auto / dialect / h2.console 는 프로파일별로 분리됨:
  #   - local  : 아래 on-profile=local 문서 (H2)
  #   - prod   : 아래 on-profile=prod 문서 (PostgreSQL)
  #   - test   : src/test/resources/application-test.yml (H2)
  # 공유(default) 문서에는 DB 접속 정보를 두지 않아 prod 가 H2 를 상속하지 않게 한다.
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:110MB}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Admin SSR — InMemory 인증 (Firebase와 완전 분리)
# ADMIN_PASSWORD_BCRYPT: BCrypt 해시 값을 k8s Secret으로 주입
admin:
  email: ${ADMIN_EMAIL:admin@tonebridge.local}
  password:
    bcrypt: ${ADMIN_PASSWORD_BCRYPT:$2a$10$placeholder-must-be-overridden-in-prod}

console:
  # lab.mungji 콘솔 집계용 서비스 토큰. 미설정 시 /api/internal/** 전부 차단(fail-closed).
  internal-token: ${CONSOLE_INTERNAL_TOKEN:}

# 로컬 개발(HTTP)에서는 false — prod 프로파일에서 true로 오버라이드
cookie:
  secure: ${COOKIE_SECURE:false}
  same-site: ${COOKIE_SAME_SITE:Lax}

jwt:
  secret: ${JWT_SECRET}   # FAIL fix: 기본값 제거 — 미설정 시 기동 실패로 운영 노출 방지
  access-token-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  refresh-token-ttl-minutes: ${JWT_REFRESH_TTL_MINUTES:43200}

google:
  oauth2:
    client-id: ${GOOGLE_CLIENT_ID:}
    ios-client-id: ${GOOGLE_IOS_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    token-uri: https://oauth2.googleapis.com/token
    userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo

tonebridge:
  storage:
    # Blank = AWS S3 (SDK resolves endpoint automatically).
    # Non-blank = S3-compatible (MinIO / local): uses forcePathStyle + endpointOverride.
    endpoint: ${STORAGE_ENDPOINT:}
    public-endpoint: ${STORAGE_PUBLIC_ENDPOINT:}  # mobile/browser-accessible URL for presigned URLs; defaults to endpoint
    access-key: ${STORAGE_ACCESS_KEY}   # WARN fix: minioadmin 기본값 제거 — 미설정 시 기동 실패
    secret-key: ${STORAGE_SECRET_KEY}   # 로컬 개발은 환경변수 또는 .env.local 사용
    bucket: ${STORAGE_BUCKET:tonebridge-audio}
    region: ${STORAGE_REGION:us-east-1}
    upload-ttl-minutes: ${STORAGE_UPLOAD_TTL_MINUTES:15}
    download-ttl-minutes: ${STORAGE_DOWNLOAD_TTL_MINUTES:15}
    rate-limit-per-minute: ${STORAGE_RATE_LIMIT_PER_MINUTE:20}
  ai:
    enabled: ${AI_ENABLED:false}
    claude-api-key: ${CLAUDE_API_KEY:}
    claude-model: ${CLAUDE_MODEL:claude-sonnet-4-6}
    openai-api-key: ${OPENAI_API_KEY:}
  credit:
    signup-bonus: 30
    text-request-cost: 5
    audio-request-cost: 10
    text-correction-reward: 4
    audio-correction-reward: 8
    audio-with-recording-reward: 12
    streak-7day-bonus: 10
    accept-bonus: 5
  correction:
    expiry-hours: 48
    ai-fallback-after-hours: 48
    fallback-scheduler-interval-ms: ${FALLBACK_SCHEDULER_INTERVAL_MS:3600000}
  fcm:
    service-account-path: ${FCM_SERVICE_ACCOUNT_PATH:}
    project-id: ${FCM_PROJECT_ID:}
  gamification:
    streak-enabled: true
    reputation-enabled: true
    badges-enabled: true
    badge-fast-responder-count: 5
    badge-audio-expert-count: 10
    fast-responder-max-minutes: 60
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/auth/google/callback}
    mobile-redirect-uri: ${GOOGLE_MOBILE_REDIRECT_URI:tonebridge://oauth/callback}
  admin:
    emails: ${ADMIN_EMAILS:}  # required in production; set via ADMIN_EMAILS env var

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
  api-docs:
    path: /v3/api-docs

logging:
  level:
    me.yeonjae.tonebridge: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ── local 프로파일 전용: H2 (in-memory, PostgreSQL 호환 모드) ──────────
# 로컬 개발 / 슬라이스 테스트 기본 DB. 운영은 아래 prod 문서의 PostgreSQL.
# H2 를 공유 문서가 아닌 이 프로파일 문서에 격리해, prod 와 같은 블록에서
# 함께 수정되는 사고를 막는다.
---
spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:tonebridge;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      # 로컬 H2: JPA_DDL_AUTO=create-drop 로 오버라이드 가능. 운영(prod)은 none(Flyway 관리).
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  h2:
    console:
      enabled: false

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db, redis

logging:
  level:
    me.yeonjae.tonebridge: INFO
    org.hibernate.SQL: WARN
cookie:
  secure: true

jwt:
  secret: ${JWT_SECRET}

tonebridge:
  storage:
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
